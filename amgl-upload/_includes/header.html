<header class="site-nav" id="siteNav">
  <div class="nav-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 34 34" width="30" height="30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="17" cy="17" r="13.5" stroke="currentColor" stroke-width="1.6" opacity="0.9"/>
          <circle cx="17" cy="17" r="7" stroke="currentColor" stroke-width="1.4" opacity="0.55"/>
          <circle cx="17" cy="17" r="2.4" fill="var(--gold)"/>
          <circle cx="27.5" cy="8.5" r="2.1" fill="currentColor"/>
          <circle cx="5.8" cy="24.5" r="1.6" fill="currentColor" opacity="0.7"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">{{ site.data.settings.lab_short }}<span class="brand-dot">.</span></span>
        <span class="brand-sub">{{ site.data.settings.department_label }}</span>
      </span>
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="{{ '/' | relative_url }}" {% if page.nav == 'home' %}class="active"{% endif %}>Home</a>
      <a href="{{ '/research/' | relative_url }}" {% if page.nav == 'research' %}class="active"{% endif %}>Research</a>
      <a href="{{ '/members/' | relative_url }}" {% if page.nav == 'members' %}class="active"{% endif %}>Members</a>
      <a href="{{ '/publications/' | relative_url }}" {% if page.nav == 'publications' %}class="active"{% endif %}>Publications</a>
      <a href="{{ '/contact/' | relative_url }}" {% if page.nav == 'contact' %}class="active"{% endif %}>Contact</a>
    </nav>
    <div class="nav-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <button class="nav-burger" id="navBurger" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
