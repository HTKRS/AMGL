- title: 3D Nano Fabrication & Devices
  color: blue
  icon: printer
  tags:
    - Meniscus-Guided 3D Printing
    - Nanoscale Architectures
    - CNT · PEDOT:PSS Structures
    - Additive Manufacturing
  description: >-
    We develop an in-house meniscus-guided 3D nanoprinter that enables
    rapid and simple fabrication of three-dimensional nanostructures.
    Using colloidal nanoparticle inks — metals, carbon nanotubes,
    conducting polymers, and quantum dots — we build composite
    architectures such as Au nanotips, CNT–QD hybrid structures, and
    PEDOT:PSS microstructures for next-generation nanodevices.

- title: Plasmonic Nanostructures & SERS
  color: gold
  icon: wave
  tags:
    - SERS Sensing
    - Nanogap Engineering
    - Self-Assembly
    - FDTD Simulation
  description: >-
    Plasmonic nanostructures concentrate light into nanometer-scale
    volumes. We engineer nanogap structures — hole-sphere platforms,
    nanoparticle-on-mirror cavities, and self-assembled dimers with
    sub-5 nm gaps — for ultrasensitive, quantitative surface-enhanced
    Raman scattering (SERS) sensing and reliable on-site molecular
    analysis.

- title: Quantum Dot Optoelectronics
  color: violet
  icon: dots
  tags:
    - Semiconductor Quantum Dots
    - Optical Sensors
    - UCNP
    - QD Lasers & Displays
  description: >-
    Semiconductor quantum dots are quantum light sources attracting
    significant attention for lighting, displays, quantum cryptography,
    and quantum computing. Combined with engineered nanostructures,
    quantum dots achieve improved signal quality in reproducibility
    and directionality, opening routes to high-performance
    optoelectronic devices.

- title: Bio-Nano Hybrid Materials
  color: teal
  icon: dna
  tags:
    - M13 Bacteriophage
    - Bio-Semiconductor
    - Functional Platforms
  description: >-
    By merging genetically engineered biological building blocks with
    semiconductor materials, we create functional structures that
    neither component could achieve alone. Our current focus is on
    integrating engineered biomaterials such as the M13 bacteriophage
    with quantum dots and plasmonic structures.

- title: Biosensors & Soft Actuators
  color: rose
  icon: pulse
  tags:
    - Nano-Bio Sensors
    - Colorimetric Sensing
    - Medical Diagnostics
    - Soft Microactuators
  description: >-
    We develop nano-bio material-based biosensors — colorimetric
    arrays, electronic noses, and SERS platforms — in collaboration
    with clinical researchers for medical diagnostics. We also build
    soft composite microactuators, such as magnetite–PEDOT:PSS
    structures, via meniscus-assisted 3D printing.
