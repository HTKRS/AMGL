<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.data.settings.lab_short }} @ {{ site.data.settings.university }}</title>
  {% assign meta_desc = site.data.settings.meta_description | strip_newlines | strip %}
  {% if meta_desc == "" %}{% assign meta_desc = site.data.settings.about | strip_newlines | truncate: 160 %}{% endif %}
  <meta name="description" content="{{ meta_desc | escape }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/fonts/PretendardVariable.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('amgl-theme'); } catch (e) {}
      if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      var l = null;
      try { l = localStorage.getItem('amgl-lang'); } catch (e) {}
      if (!l) { l = (navigator.language || '').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en'; }
      document.documentElement.setAttribute('data-lang', l);
      document.documentElement.setAttribute('lang', l);
    })();
  </script>
</head>
<body class="{% if page.hero %}has-hero{% endif %}">
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
