- title: Meniscus-Guided 3D Nanoprinting
  color: blue
  icon: printer
  image: R1.png
  tags:
    - Meniscus-Guided Printing
    - Colloidal Nanoparticle Inks
    - Free-Standing Micro/Nanopillars
    - Au · CNT · PEDOT:PSS · QD
  description: >-
    Our in-house meniscus-guided 3D nanoprinter draws a colloidal ink
    through a nanopipette and lets a moving meniscus deposit particles
    layer by layer, so free-standing micro- and nanostructures grow
    directly from solution — no lithography, no cleanroom. We have
    printed Au nanotips, CNT–quantum dot hybrid pillars, and
    PEDOT:PSS microelectrodes, and we study how ink chemistry and
    substrate interfaces decide whether a printed pillar stands or fails.
  dois:
    - 10.1039/D5NR04848F
    - 10.1016/j.synthmet.2026.118075
    - 10.5757/ASCT.2026.35.5.166

- title: Plasmonic Nanostructures & SERS Sensing
  color: gold
  icon: wave
  image: R2.png
  tags:
    - Nanogap Engineering
    - Wafer-Scale Self-Assembly
    - SERS
    - FDTD / FEM Simulation
  description: >-
    Metallic nanogaps squeeze light into volumes a few nanometres wide,
    amplifying Raman signals by many orders of magnitude. We build these
    hotspots over whole wafers with lithography-free routes — dewetting,
    hole-sphere assembly, and 3D-printed nanoparticle clusters — and pair
    them with electromagnetic simulation to make surface-enhanced Raman
    scattering (SERS) uniform, quantitative, and ready for on-site analysis.
  dois:
    - 10.1002/lpor.71610
    - 10.1039/D5NR03414K
    - 10.1039/d4nh00546e

- title: Soft Microactuators & 3D-Printed Microdevices
  color: rose
  icon: pulse
  image: R3.png
  tags:
    - Bioinspired Actuation
    - Humidity / Magnetic Response
    - Nanoparticle–Polymer Composites
    - Microrobotics
  description: >-
    By printing a rigid nanoparticle scaffold together with a responsive
    polymer in a single step, we obtain microscale composite pillars that
    bend, elongate, and recover on demand. Humidity-driven AuNP–PVP
    actuators inspired by insect joints and magnetically driven
    magnetite–PEDOT:PSS actuators point toward microgrippers, valves,
    and small-scale robotic components built without assembly.
  dois:
    - 10.1007/s42114-026-02151-5
    - 10.1002/admt.202501312

- title: Bio-Nano Hybrid Biosensors
  color: teal
  icon: dna
  image: R4.png
  tags:
    - M13 Bacteriophage
    - Colorimetric Sensor Arrays
    - Bioelectronic Nose
    - Medical Diagnostics
  description: >-
    Genetically engineered M13 bacteriophage gives us a programmable
    biological building block whose surface chemistry can be tuned to
    specific molecules. Assembled into colour-changing arrays and
    plasmonic platforms, and read out with machine learning, these
    phage-based "noses" detect volatile biomarkers — including
    exhaled-breath signatures of lung cancer — and form the basis of
    our point-of-care diagnostic sensors.
  dois:
    - 10.1016/j.bios.2021.113567
    - 10.1016/j.bios.2021.113693
    - 10.1186/s40580-022-00351-5
