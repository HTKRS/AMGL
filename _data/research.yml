#  연구 분야 (Research)
#  카드 하나 = 항목 하나. 순서대로 01, 02, ... 번호가 붙습니다.
#  color : blue / gold / teal / rose / violet 중 선택
#  image : assets/img/research/ 폴더 안의 파일명 (예: R1.webp). 없으면 아이콘만 표시
#  lead  : 한 줄 핵심 문장 (굵게 표시, 20단어 이내)
