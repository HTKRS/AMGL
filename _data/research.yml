- title: Meniscus-Guided 3D Nanoprinting
  color: blue
  icon: printer
  image: R1.png
  lead: >-
    We print free-standing 3D nanostructures straight from nanoparticle ink,
    without lithography or a cleanroom.
  description: >-
    A nanopipette pulls a liquid meniscus upward and particles pack into a
    growing pillar, layer by layer. Au, carbon nanotube, PEDOT:PSS and
    quantum-dot inks all work on the same in-house printer.
  tags:
    - Meniscus-Guided Printing
    - Nanoparticle Inks
    - Free-Standing Pillars
  dois:
    - 10.1039/D5NR04848F
    - 10.1016/j.synthmet.2026.118075
    - 10.5757/ASCT.2026.35.5.166

- title: Plasmonic Nanostructures & SERS Sensing
  color: gold
  icon: wave
  image: R2.png
  lead: >-
    Wafer-scale nanogap hotspots that make surface-enhanced Raman sensing
    uniform, quantitative and field-ready.
  description: >-
    Dewetting, hole-sphere assembly and 3D-printed nanoparticle clusters
    give us lithography-free hotspots over whole wafers. Electromagnetic
    simulation guides every design.
  tags:
    - Nanogap Engineering
    - SERS
    - Self-Assembly
  dois:
    - 10.1002/lpor.71610
    - 10.1039/D5NR03414K
    - 10.1039/d4nh00546e

- title: Soft Microactuators & 3D-Printed Microdevices
  color: rose
  icon: pulse
  image: R3.png
  lead: >-
    Microscale pillars that bend and recover on demand, printed in a single
    step with no assembly.
  description: >-
    A rigid nanoparticle scaffold and a responsive polymer are printed
    together. Humidity-driven AuNP–PVP and magnetically driven
    magnetite–PEDOT:PSS actuators point toward microgrippers and valves.
  tags:
    - Bioinspired Actuation
    - Humidity / Magnetic Response
    - Microrobotics
  dois:
    - 10.1007/s42114-026-02151-5
    - 10.1002/admt.202501312

- title: Bio-Nano Hybrid Biosensors
  color: teal
  icon: dna
  image: R4.png
  lead: >-
    Engineered M13 bacteriophage "noses" that read volatile biomarkers,
    from food spoilage to lung-cancer breath.
  description: >-
    The phage surface is genetically tuned to target molecules, assembled
    into colour-changing arrays, and read out with machine learning. This is
    the base of our point-of-care diagnostic sensors.
  tags:
    - M13 Bacteriophage
    - Colorimetric Arrays
    - Medical Diagnostics
  dois:
    - 10.1016/j.bios.2021.113567
    - 10.1016/j.bios.2021.113693
    - 10.1186/s40580-022-00351-5
